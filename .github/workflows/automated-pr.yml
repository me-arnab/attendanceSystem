name: Automated PR (feature/fix to develop, hotfix to main)

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  create-or-update-pr:
    name: Create or Update PR & Enable Squash Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App installation token (if configured)
        id: app-token
        if: ${{ vars.GH_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Determine target branch and create/update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ -z "${{ steps.app-token.outputs.token }}" ]; then
            echo "::warning::GH_APP_ID/GH_APP_PRIVATE_KEY not configured; using GITHUB_TOKEN. Note: GitHub suppresses downstream push/deploy triggers for PRs auto-merged by GITHUB_TOKEN."
          fi

          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == hotfix/* ]]; then
            TARGET="main"
          else
            TARGET="develop"
          fi

          if ! git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then
            echo "Remote target branch '${TARGET}' does not exist yet. Skipping automated PR creation."
            exit 0
          fi

          AHEAD_COUNT=$(git rev-list --count "origin/${TARGET}..HEAD")
          if [ "$AHEAD_COUNT" -eq 0 ]; then
            echo "Branch '${BRANCH}' has no commits ahead of '${TARGET}'. Skipping PR creation."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --base "$TARGET" --head "$BRANCH" --state open --json number --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            PR_URL=$(gh pr create \
              --base "$TARGET" \
              --head "$BRANCH" \
              --title "chore(auto-pr): merge ${BRANCH} into ${TARGET}" \
              --body "Automated Pull Request created from \`${BRANCH}\` targeting \`${TARGET}\`. Squash auto-merge will complete once all required CI checks pass.")
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "Created PR #${PR_NUMBER} targeting ${TARGET}"
          else
            PR_NUMBER="$EXISTING_PR"
            echo "Found existing open PR #${PR_NUMBER} targeting ${TARGET}"
          fi

          gh pr merge "$PR_NUMBER" --auto --squash || echo "Auto-merge could not be enabled yet (ensure repository auto-merge and branch protection are enabled in GitHub settings)."