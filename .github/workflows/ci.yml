name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install backend dependencies (for tsx test runner)
        run: npm --prefix backend ci

      - name: Run ESLint (if configured)
        run: |
          if ls frontend/.eslintrc* frontend/eslint.config.* >/dev/null 2>&1; then
            npm --prefix frontend run lint
          else
            echo "No ESLint configuration found in frontend/; skipping lint step."
          fi

      - name: Frontend TypeScript validation
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend unit tests
        run: npm run test:frontend

      - name: Frontend production build
        run: npm --prefix frontend run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run ESLint (if configured)
        run: |
          if ls backend/.eslintrc* backend/eslint.config.* >/dev/null 2>&1; then
            npm --prefix backend run lint
          else
            echo "No ESLint configuration found in backend/; skipping lint step."
          fi

      - name: Backend TypeScript validation
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend production build
        run: npm --prefix backend run build

  security:
    name: Security & Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies for audit
        run: |
          npm --prefix frontend ci
          npm --prefix backend ci

      - name: Dependency vulnerability scan (production dependencies)
        run: |
          npm --prefix frontend audit --omit=dev --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high

      - name: Verify no .env or credential files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|atlas-credentials\.env' | grep -v '\.env\.example$'; then
            echo "ERROR: Environment or credential file is tracked in Git!"
            exit 1
          fi
          echo "OK: No .env or credential files tracked in Git."

      - name: Scan repository for hardcoded secrets
        run: |
          if git grep -nE '(mongodb\+srv://[^<\s]+:[^@\s]+@|ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':(exclude)docs/*' ':(exclude)*.md'; then
            echo "ERROR: Potential hardcoded secret detected!"
            exit 1
          fi
          echo "OK: No hardcoded secrets found."

      - name: Validate configuration templates
        run: |
          test -f backend/.env.example
          test -f frontend/.env.example
          grep -q "JWT_SECRET" backend/.env.example
          grep -q "MONGODB_URI" backend/.env.example
          echo "OK: Environment templates validated."

  integration:
    name: Integration & Safety Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend, security]
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: '5050'
      MONGODB_URI: mongodb://127.0.0.1:27017/attendease_ci_test
      JWT_SECRET: ci_isolated_test_jwt_secret_minimum_32_characters_long_2026
      JWT_EXPIRES_IN: 1d
      FRONTEND_URL: http://localhost:5173
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Build backend
        run: npm --prefix backend run build

      - name: Seed isolated test database
        run: npm --prefix backend run seed

      - name: Run Chat & Connection isolation tests
        run: npm --prefix backend run test:chat

      - name: Run Socket.IO real-time & presence tests
        run: npm --prefix backend run test:realtime

      - name: Run Chat Date Separators tests (if present)
        run: |
          if [ -f backend/src/scripts/testChatDateSeparators.ts ]; then
            npm --prefix backend run test:date-separators
          else
            echo "testChatDateSeparators.ts not present on this branch; skipping."
          fi

      - name: Run Critical Attendance Safety & RBAC tests
        run: npm --prefix backend run test:safety

      - name: Start isolated test server and run E2E suite
        run: |
          node backend/dist/server.js > /tmp/attendease-ci-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5050/api/health >/dev/null; then
              echo "CI test server is healthy."
              break
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:5050/api/health >/dev/null
          npm run test:e2e
