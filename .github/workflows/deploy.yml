name: Production Deployment (Netlify & Render)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pre-deploy-validation:
    name: Pre-Deploy Build & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Validate production builds
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix backend ci
          npm --prefix backend run build

      - name: Verify no .env or credential files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|atlas-credentials\.env' | grep -v '\.env\.example$'; then
            echo "ERROR: Environment or credential file tracked in Git!"
            exit 1
          fi

  deploy-production:
    name: Trigger Render & Netlify Production Deploys
    runs-on: ubuntu-latest
    needs: pre-deploy-validation
    environment:
      name: production
    steps:
      - name: Verify required deployment secrets are configured
        run: |
          missing=0
          for var in BACKEND_DEPLOY_HOOK_URL FRONTEND_DEPLOY_HOOK_URL BACKEND_HEALTH_URL FRONTEND_URL; do
            if [ -z "${!var}" ]; then
              echo "ERROR: Required secret $var is not set."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

      - name: Trigger Render Backend Deploy Hook
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.BACKEND_DEPLOY_HOOK_URL }}")
          echo "Render deploy hook HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Render deploy hook failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Trigger Netlify Frontend Build Hook
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{}' "${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}")
          echo "Netlify build hook HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Netlify build hook failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Verify Render Backend /api/health endpoint
        run: |
          echo "Waiting for Render backend health check..."
          for i in $(seq 1 36); do
            RESPONSE=$(curl -s -w "\n%{http_code}" "${{ secrets.BACKEND_HEALTH_URL }}" || true)
            CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$CODE" = "200" ] && echo "$BODY" | grep -qE '"status"[[:space:]]*:[[:space:]]*"OK"'; then
              echo "Backend health check passed (attempt $i)."
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE (waiting 10s)..."
            sleep 10
          done
          echo "ERROR: Backend health check failed after 6 minutes."
          exit 1

      - name: Verify Netlify Frontend availability
        run: |
          echo "Waiting for Netlify frontend availability..."
          for i in $(seq 1 24); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L "${{ secrets.FRONTEND_URL }}" || true)
            if [ "$CODE" = "200" ]; then
              echo "Frontend availability check passed (attempt $i)."
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE (waiting 10s)..."
            sleep 10
          done
          echo "ERROR: Frontend availability check failed after 4 minutes."
          exit 1

      - name: Record Deployment Version Summary
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "## AttendEase Production Deployment Summary"
            echo "- **Commit SHA**: \`${GITHUB_SHA}\` (\`${SHORT_SHA}\`)"
            echo "- **Branch**: \`${GITHUB_REF_NAME}\`"
            echo "- **Triggered By**: \`${GITHUB_ACTOR}\`"
            echo "- **Timestamp (UTC)**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "- **Backend**: Render (deploy hook + \`/api/health\` verified)"
            echo "- **Frontend**: Netlify (build hook + URL availability verified)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment Failure Notice
        if: failure()
        run: |
          echo "::error::Production deployment or post-deploy health verification failed for commit ${GITHUB_SHA}. Review docs/ROLLBACK.md for rollback procedures."
